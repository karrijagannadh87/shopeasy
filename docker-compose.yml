# Production-mode infrastructure for ShopEasy.
#   docker compose up -d
# Then set DATABASE_URL / REDIS_URL in shopping-backend/.env:
#   DATABASE_URL=postgres://shopeasy:shopeasy@localhost:5432/shopeasy
#   REDIS_URL=redis://localhost:6379
services:
  postgres:
    image: postgres:16-alpine
    container_name: shopeasy-postgres
    environment:
      POSTGRES_USER: shopeasy
      POSTGRES_PASSWORD: shopeasy
      POSTGRES_DB: shopeasy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopeasy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: shopeasy-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
